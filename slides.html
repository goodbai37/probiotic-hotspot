<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1f9d61">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="热点滑动">
<link rel="manifest" href="/manifest-slides.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<title>益生菌热点 · 滑动浏览</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC",sans-serif;
    background:linear-gradient(160deg,#e8f5ec 0%,#f4faf5 45%,#eef7f0 100%);
  }
  @media (prefers-color-scheme:dark){body{background:linear-gradient(160deg,#0d1524 0%,#111827 55%,#0f1a2c 100%)}}
  /* deck: 绝对定位容器, 用 transform 翻页, 不依赖原生滚动 */
  #deck{
    position:fixed;left:0;top:0;width:100%;height:100%;
    overflow:hidden;
    will-change:transform;
  }
  #deck.no-anim{transition:none !important}
  #deck.anim{transition:transform .32s cubic-bezier(.25,.8,.35,1)}
  .card{
    position:absolute;left:0;top:0;width:100%;height:100%;
    display:flex;flex-direction:column;
    padding:calc(64px + env(safe-area-inset-top)) 30px calc(70px + env(safe-area-inset-bottom));
    text-decoration:none;color:#1a2b22;background:transparent;
  }
  /* 卡片背景层: 柔和渐变 + 微光晕 */
  .card::before{
    content:"";position:absolute;inset:0;z-index:-1;
    background:
      radial-gradient(120% 60% at 85% -10%, rgba(31,157,97,.14) 0%, transparent 55%),
      radial-gradient(100% 50% at -10% 110%, rgba(37,99,235,.08) 0%, transparent 55%),
      linear-gradient(160deg,#e8f5ec 0%,#f4faf5 45%,#eef7f0 100%);
  }
  @media (prefers-color-scheme:dark){.card::before{
    background:
      radial-gradient(120% 60% at 85% -10%, rgba(52,211,153,.10) 0%, transparent 55%),
      radial-gradient(100% 50% at -10% 110%, rgba(59,130,246,.08) 0%, transparent 55%),
      linear-gradient(160deg,#0d1524 0%,#111827 55%,#0f1a2c 100%);
  }}
  /* 顶部行: 日期胶囊 */
  .topline{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
  .date-pill{
    font-size:11.5px;font-weight:600;color:#6b7a70;
    background:rgba(255,255,255,.6);border:1px solid rgba(0,0,0,.05);
    padding:5px 11px;border-radius:999px;
  }
  @media (prefers-color-scheme:dark){.date-pill{background:rgba(31,41,55,.5);color:#9ca3af;border-color:rgba(255,255,255,.06)}}
  .tag{
    align-self:flex-start;font-size:12.5px;font-weight:700;
    padding:7px 15px;border-radius:999px;margin-bottom:20px;
    letter-spacing:.4px;display:flex;align-items:center;gap:6px;
    box-shadow:0 1px 3px rgba(0,0,0,.04);
  }
  .title{
    font-size:28px;font-weight:800;line-height:1.4;
    overflow-wrap:anywhere;word-break:break-word;
    text-shadow:0 1px 0 rgba(255,255,255,.4);
  }
  @media (prefers-color-scheme:dark){.title{text-shadow:none}}
  .brief{
    margin-top:20px;
    background:rgba(255,255,255,.72);border:1px solid rgba(31,157,97,.16);
    border-left:4px solid rgba(31,157,97,.55);
    border-radius:14px;padding:14px 16px;
    font-size:14.5px;line-height:1.7;color:#3d5547;
    overflow-wrap:anywhere;word-break:break-word;
    display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:5;overflow:hidden;
    box-shadow:0 4px 14px rgba(31,157,97,.07);
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  }
  @media (prefers-color-scheme:dark){.brief{background:rgba(30,41,59,.55);border-color:rgba(52,211,153,.22);color:#9fb8a8;box-shadow:none}}
  .brief b{color:var(--ink,#1a2b22);font-weight:700}
  @media (prefers-color-scheme:dark){.brief b{color:#e5e7eb}}
  .meta{
    font-size:14px;color:#6b7a70;margin-top:20px;line-height:1.5;
    overflow-wrap:anywhere;word-break:break-word;
  }
  @media (prefers-color-scheme:dark){.meta{color:#9ca3af}}
  .score-wrap{margin-top:auto;display:flex;align-items:center;gap:12px;padding-top:40px}
  .score-label{font-size:13px;color:#6b7a70}
  @media (prefers-color-scheme:dark){.score-label{color:#9ca3af}}
  .score{
    font-size:30px;font-weight:800;line-height:1;
    background:rgba(255,255,255,.6);border:1px solid rgba(0,0,0,.04);
    border-radius:14px;padding:9px 16px;
    box-shadow:0 3px 10px rgba(20,60,40,.08);
  }
  @media (prefers-color-scheme:dark){.score{background:rgba(31,41,55,.6);box-shadow:none}}
  .open{
    margin-top:16px;text-align:center;font-size:15.5px;font-weight:700;
    padding:14px;border-radius:16px;color:#fff;background:linear-gradient(135deg,#1f9d61,#15956a);
    box-shadow:0 6px 16px rgba(31,157,97,.28);
    transition:transform .12s ease,box-shadow .12s ease;
  }
  .card:active .open{transform:scale(.97);box-shadow:0 3px 8px rgba(31,157,97,.2)}
  @media (prefers-color-scheme:dark){.open{background:linear-gradient(135deg,#10b981,#0d9488);box-shadow:0 6px 16px rgba(16,185,129,.25)}}
  .page{text-align:center;font-size:12px;color:#a8bbad;margin-top:18px}
  .loading,.error{
    height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:12px;color:#6b7a70;font-size:15px;padding:32px;text-align:center;
  }
  .error{color:#dc2626}
  .error small{color:#6b7a70;font-size:12px;margin-top:4px}
  .dots{
    position:fixed;left:0;right:0;bottom:calc(22px + env(safe-area-inset-bottom));
    display:flex;justify-content:center;gap:6px;z-index:10;pointer-events:none;
  }
  .dot{width:7px;height:7px;border-radius:50%;background:rgba(31,157,97,.25);transition:all .3s}
  @media (prefers-color-scheme:dark){.dot{background:rgba(52,211,153,.28)}}
  .dot.on{width:20px;border-radius:4px;background:linear-gradient(90deg,#1f9d61,#34d399);box-shadow:0 1px 4px rgba(31,157,97,.4)}
  /* 左右箭头按钮 (边界也能翻) */
  .nav-btn{
    position:fixed;top:50%;transform:translateY(-50%);z-index:11;
    width:46px;height:46px;border-radius:50%;
    background:rgba(255,255,255,.85);border:1px solid rgba(0,0,0,.05);
    box-shadow:0 4px 14px rgba(20,60,40,.14);
    font-size:22px;color:#1a2b22;display:flex;align-items:center;justify-content:center;
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    transition:transform .12s ease,box-shadow .12s ease;
  }
  @media (prefers-color-scheme:dark){.nav-btn{background:rgba(31,41,55,.85);color:#e5e7eb;border-color:rgba(255,255,255,.07)}}
  .nav-btn:active{transform:translateY(-50%) scale(.9);box-shadow:0 2px 6px rgba(20,60,40,.1)}
  #btnPrev{left:10px}
  #btnNext{right:10px}
  .nav-btn.hidden{display:none}
</style>
</head>
<body>
<div id="app"><div class="loading">🦠 加载中…</div></div>
<script>
const DATA_URL = "https://goodbai37.github.io/probiotic-hotspot/data.json";
const esc = s => String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");

(async () => {
  try {
    const res = await fetch(DATA_URL, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const records = await res.json();
    const latest = records[records.length - 1];
    const items = latest.items || [];
    if (!items.length) throw new Error("今日暂无数据");

    const N = items.length;
    const app = document.getElementById("app");
    const W = window.innerWidth; // 视口宽 (px) — 所有定位用同一基准
    app.innerHTML = `<div id="deck" class="no-anim">` + items.map((it, i) => {
      const isReg = it.tag === "法规动态";
      const tagText = isReg ? "⚖️ 法规动态" : "🔬 相关文献";
      const tagColor = isReg ? "#d97706" : "#2563eb";
      const tagBg = isReg ? "rgba(217,119,6,.12)" : "rgba(37,99,235,.10)";
      const scoreColor = isReg ? "#d97706" : "#1f9d61";
      return `<a class="card" style="left:${i * W}px;width:${W}px" href="${esc(it.url || "#")}" data-idx="${i}">
        <div class="topline"><span class="date-pill">📅 ${esc(it.date || "")}</span></div>
        <div class="tag" style="color:${tagColor};background:${tagBg}">${tagText}</div>
        <div class="title">${esc(it.text || it.title || "")}</div>
        ${it.brief ? `<div class="brief">💡 <span>${esc(it.brief)}</span></div>` : ""}
        <div class="meta">${esc([it.journal, it.date].filter(Boolean).join("  ·  "))}</div>
        <div class="score-wrap">
          <span class="score-label">热度</span>
          <span class="score" style="color:${scoreColor}">${esc(String(it.score ?? "—"))}</span>
        </div>
        <div class="open">查看原文 →</div>
        <div class="page">${i+1} / ${N} · 左右滑动</div>
      </a>`;
    }).join("") + `</div>`;

    // 圆点
    const dots = document.createElement("div");
    dots.className = "dots";
    dots.innerHTML = items.map((_, i) => `<span class="dot${i===0?" on":""}"></span>`).join("");
    document.body.appendChild(dots);
    const dotEls = [...dots.children];

    // 左右箭头
    const prev = document.createElement("button");
    prev.id = "btnPrev"; prev.className = "nav-btn"; prev.innerHTML = "‹";
    const next = document.createElement("button");
    next.id = "btnNext"; next.className = "nav-btn"; next.innerHTML = "›";
    document.body.appendChild(prev); document.body.appendChild(next);

    const deck = document.getElementById("deck");
    // 关键: deck 宽度必须容纳所有卡片 (N 张 × 屏幕宽),
    // 否则 overflow:hidden 会把第 2 张以后的卡片全部裁掉 -> 翻页空白
    deck.style.width = (N * W) + "px";
    let cur = 0, startX = 0, startY = 0, dragging = false, moved = false;

    function updateDots() {
      dotEls.forEach((d, i) => d.classList.toggle("on", i === cur));
      prev.classList.toggle("hidden", cur === 0);
      next.classList.toggle("hidden", cur === N - 1);
    }
    function go(idx, anim) {
      cur = Math.max(0, Math.min(N - 1, idx));
      deck.classList.toggle("anim", !!anim);
      deck.classList.toggle("no-anim", !anim);
      deck.style.transform = `translateX(${-cur * W}px)`;
      updateDots();
    }

    // 触摸翻页
    document.addEventListener("touchstart", e => {
      if (e.touches.length !== 1) return;
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      dragging = true; moved = false;
    }, { passive: true });

    document.addEventListener("touchmove", e => {
      if (!dragging || e.touches.length !== 1) return;
      const dx = e.touches[0].clientX - startX;
      const dy = e.touches[0].clientY - startY;
      if (Math.abs(dx) < 6) return;                       // 未确定方向
      if (Math.abs(dy) > Math.abs(dx)) { dragging = false; return; } // 纵向不拦截
      e.preventDefault();
      moved = true;
      deck.classList.add("no-anim"); deck.classList.remove("anim");
      deck.style.transform = `translateX(${(-cur * W) + dx}px)`;
    }, { passive: false });

    document.addEventListener("touchend", e => {
      if (!dragging) return;
      dragging = false;
      const dx = e.changedTouches[0].clientX - startX;
      const w = window.innerWidth;
      let target = cur;
      if (moved) {
        if (dx < -w * 0.15) target = cur + 1;      // 左滑 -> 下一页
        else if (dx > w * 0.15) target = cur - 1;  // 右滑 -> 上一页
        // 位移不足阈值: 回弹当前页
      }
      go(target, true);
      if (moved) setTimeout(() => { moved = false; }, 380); // 屏蔽滑动后的误触
    }, { passive: true });

    // 点击屏蔽 (滑动后短暂生效)
    document.addEventListener("click", e => {
      if (moved) { e.preventDefault(); e.stopPropagation(); }
    }, true);

    // 箭头按钮
    prev.addEventListener("click", () => go(cur - 1, true));
    next.addEventListener("click", () => go(cur + 1, true));

    // 旋转/窗口变化: 重算卡片位置 (像素基准需刷新)
    let rszTimer;
    window.addEventListener("resize", () => {
      clearTimeout(rszTimer);
      rszTimer = setTimeout(() => {
        const W2 = window.innerWidth;
        deck.style.width = (N * W2) + "px";
        document.querySelectorAll(".card").forEach((c, i) => {
          c.style.left = (i * W2) + "px";
          c.style.width = W2 + "px";
        });
        deck.style.transform = `translateX(${-cur * W2}px)`;
      }, 200);
    });

    go(0, false);
    updateDots();
  } catch (e) {
    document.getElementById("app").innerHTML =
      `<div class="error">⚠️ 加载失败<br><small>${esc(e.message || e)}<br>请检查网络后重试</small></div>`;
  }
})();
</script>
</body>
</html>
