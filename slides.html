<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1f9d61">
<title>益生菌热点 · 滑动浏览</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC",sans-serif;
    background:#eef3ee;
  }
  @media (prefers-color-scheme:dark){body{background:#111827}}
  .track{
    display:flex;height:100%;width:100%;overflow-x:auto;overflow-y:hidden;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;
  }
  .track::-webkit-scrollbar{display:none}
  .card{
    flex:0 0 100%;min-width:0;width:100%;
    display:flex;flex-direction:column;
    padding:calc(64px + env(safe-area-inset-top)) 32px calc(56px + env(safe-area-inset-bottom));
    text-decoration:none;color:#1a2b22;
  }
  @media (prefers-color-scheme:dark){.card{color:#e5e7eb}}
  .tag{
    align-self:flex-start;font-size:13px;font-weight:700;
    padding:6px 14px;border-radius:999px;margin-bottom:28px;
  }
  .title{
    font-size:27px;font-weight:800;line-height:1.45;
    overflow-wrap:anywhere;word-break:break-word;
  }
  .meta{
    font-size:14px;color:#6b7a70;margin-top:20px;line-height:1.5;
    overflow-wrap:anywhere;word-break:break-word;
  }
  @media (prefers-color-scheme:dark){.meta{color:#9ca3af}}
  .score-wrap{margin-top:auto;display:flex;align-items:baseline;gap:10px;padding-top:44px}
  .score-label{font-size:13px;color:#6b7a70}
  @media (prefers-color-scheme:dark){.score-label{color:#9ca3af}}
  .score{font-size:30px;font-weight:800}
  .open{
    margin-top:14px;text-align:center;font-size:16px;font-weight:700;
    padding:14px;border-radius:16px;color:#1f9d61;background:rgba(31,157,97,.10);
  }
  @media (prefers-color-scheme:dark){.open{color:#34d399}}
  .page{text-align:center;font-size:12px;color:#a8bbad;margin-top:18px}
  .loading,.error{
    height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:12px;color:#6b7a70;font-size:15px;padding:32px;text-align:center;
  }
  .error{color:#dc2626}
  .error small{color:#6b7a70;font-size:12px;margin-top:4px}
  .dots{
    position:fixed;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom));
    display:flex;justify-content:center;gap:6px;z-index:10;pointer-events:none;
  }
  .dot{width:7px;height:7px;border-radius:50%;background:#c3d4c9;transition:all .25s}
  @media (prefers-color-scheme:dark){.dot{background:#374151}}
  .dot.on{width:18px;border-radius:4px;background:#1f9d61}
</style>
</head>
<body>
<div id="app"><div class="loading">🦠 加载中…</div></div>
<script>
const DATA_URL = "https://goodbai37.github.io/probiotic-hotspot/data.json";
const esc = s => String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");

(async () => {
  try {
    const res = await fetch(DATA_URL, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const records = await res.json();
    const latest = records[records.length - 1];
    const items = latest.items || [];
    if (!items.length) throw new Error("今日暂无数据");

    const app = document.getElementById("app");
    app.innerHTML = `<div class="track">` + items.map((it, i) => {
      const isReg = it.tag === "法规动态";
      const tagText = isReg ? "⚖️ 法规动态" : "🔬 相关文献";
      const tagColor = isReg ? "#d97706" : "#2563eb";
      const tagBg = isReg ? "rgba(217,119,6,.12)" : "rgba(37,99,235,.10)";
      const scoreColor = isReg ? "#d97706" : "#1f9d61";
      return `<a class="card" href="${esc(it.url || "#")}" data-idx="${i}">
        <div class="tag" style="color:${tagColor};background:${tagBg}">${tagText}</div>
        <div class="title">${esc(it.text || it.title || "")}</div>
        <div class="meta">${esc([it.journal, it.date].filter(Boolean).join("  ·  "))}</div>
        <div class="score-wrap">
          <span class="score-label">热度</span>
          <span class="score" style="color:${scoreColor}">${esc(String(it.score ?? "—"))}</span>
        </div>
        <div class="open">查看原文 →</div>
        <div class="page">${i+1} / ${items.length} · 左右滑动</div>
      </a>`;
    }).join("") + `</div>`;

    // 底部圆点指示器
    const dots = document.createElement("div");
    dots.className = "dots";
    dots.innerHTML = items.map((_, i) => `<span class="dot${i===0?" on":""}"></span>`).join("");
    document.body.appendChild(dots);

    const track = app.querySelector(".track");
    const dotEls = [...dots.children];
    const N = items.length;

    function go(idx) {
      idx = Math.max(0, Math.min(N - 1, idx));
      track.scrollTo({ left: idx * track.clientWidth, behavior: "smooth" });
      dotEls.forEach((d, i) => d.classList.toggle("on", i === idx));
    }

    // 触摸翻页: 横向滑动 > 阈值 => 翻页
    let startX = 0, startY = 0, startLeft = 0, swiping = false, moved = false;
    track.addEventListener("touchstart", e => {
      if (e.touches.length !== 1) return;
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      startLeft = track.scrollLeft;
      swiping = true; moved = false;
    }, { passive: true });

    track.addEventListener("touchmove", e => {
      if (!swiping || e.touches.length !== 1) return;
      const dx = e.touches[0].clientX - startX;
      const dy = e.touches[0].clientY - startY;
      // 纵向滑动(上下)不拦截; 横向滑动(左右)才翻页
      if (Math.abs(dx) < 8) return;
      if (Math.abs(dy) > Math.abs(dx)) { swiping = false; return; }
      e.preventDefault();
      if (Math.abs(dx) > 10) moved = true;
      track.scrollLeft = startLeft - dx; // 手指跟手
    }, { passive: false });

    track.addEventListener("touchend", e => {
      if (!swiping) return;
      swiping = false;
      const w = track.clientWidth || 1;
      const dx = track.scrollLeft - startLeft;
      const cur = Math.round(startLeft / w);
      let target = cur;
      if (dx < -w * 0.22) target = cur + 1;      // 左滑 -> 下一页
      else if (dx > w * 0.22) target = cur - 1;  // 右滑 -> 上一页
      go(target);
      // 滑动后短暂屏蔽点击(防止误触卡片链接)
      if (moved) {
        setTimeout(() => { moved = false; }, 350);
      }
    }, { passive: true });

    // 滑动后屏蔽卡片点击
    track.addEventListener("click", e => {
      if (moved) { e.preventDefault(); e.stopPropagation(); }
    }, true);

    // 滚动时同步圆点 (兼容桌面滚轮/拖拽)
    track.addEventListener("scroll", () => {
      const idx = Math.round(track.scrollLeft / (track.clientWidth || 1));
      dotEls.forEach((d, i) => d.classList.toggle("on", i === idx));
    }, { passive: true });
  } catch (e) {
    document.getElementById("app").innerHTML =
      `<div class="error">⚠️ 加载失败<br><small>${esc(e.message || e)}<br>请检查网络后重试</small></div>`;
  }
})();
</script>
</body>
</html>
