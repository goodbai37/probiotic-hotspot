<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f9d61">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>益生菌研发热点速览</title>
<style>
  :root{
    --bg:#eef3ee; --card:#fff; --ink:#1a2b22; --ink-2:#6b7a70; --line:#eef2ee;
    --green:#1f9d61; --blue:#2563eb; --amber:#d97706; --radius:24px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","MiSans","Microsoft YaHei",sans-serif;
    background:var(--bg);min-height:100vh;display:flex;flex-direction:column;align-items:center;
    padding:calc(32px + env(safe-area-inset-top)) 20px env(safe-area-inset-bottom);
  }
  .wrap{max-width:360px;width:100%}
  .logo{display:flex;align-items:center;gap:14px;margin-bottom:24px}
  .logo-icon{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,#1f9d61,#0d9488);display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 8px 20px rgba(31,157,97,.3)}
  .logo h1{font-size:20px;font-weight:800;color:var(--ink);letter-spacing:.3px}
  .logo p{font-size:12px;color:var(--ink-2);margin-top:3px}
  .card{
    background:var(--card);border-radius:var(--radius);
    box-shadow:0 8px 24px rgba(20,60,40,.10);padding:8px;
    display:flex;flex-direction:column;gap:8px;margin-bottom:16px;
  }
  .entry{
    display:flex;align-items:center;gap:12px;padding:15px 14px;border-radius:18px;
    text-decoration:none;transition:background .12s ease,transform .12s ease;
  }
  .entry:active{transform:scale(.98)}
  .entry .e-icon{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
  .entry .e-body{flex:1}
  .entry .e-title{font-size:14.5px;font-weight:700;color:var(--ink)}
  .entry .e-desc{font-size:11.5px;color:var(--ink-2);margin-top:2px}
  .entry .e-arrow{font-size:18px;color:#9db3a6}
  .e1 .e-icon{background:rgba(31,157,97,.12)}
  .e2 .e-icon{background:rgba(37,99,235,.10)}
  .e3 .e-icon{background:rgba(217,119,6,.12)}
  .e4 .e-icon{background:rgba(124,58,237,.10)}
  .updated{text-align:center;font-size:11px;color:var(--ink-2)}
  .updated b{color:var(--green)}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <div class="logo-icon">🦠</div>
    <div>
      <h1>益生菌研发热点</h1>
      <p>菌株研究 · 法规动态 · 每日更新</p>
    </div>
  </div>

  <div class="card">
    <a class="entry e1" href="slides.html">
      <div class="e-icon">🔄</div>
      <div class="e-body">
        <div class="e-title">滑动浏览今日热点</div>
        <div class="e-desc">全屏左右滑，一页一条，含内容概括</div>
      </div>
      <div class="e-arrow">›</div>
    </a>
    <a class="entry e2" href="widget.html">
      <div class="e-icon">📋</div>
      <div class="e-body">
        <div class="e-title">列表查看全部</div>
        <div class="e-desc">今日 Top 10，点击直达原文</div>
      </div>
      <div class="e-arrow">›</div>
    </a>
    <a class="entry e3" href="archive.html">
      <div class="e-icon">🗂️</div>
      <div class="e-body">
        <div class="e-title">历史存档</div>
        <div class="e-desc">往期热点记录</div>
      </div>
      <div class="e-arrow">›</div>
    </a>
    <a class="entry e4" href="install-widget.html">
      <div class="e-icon">📲</div>
      <div class="e-body">
        <div class="e-title">装到桌面 / 小组件</div>
        <div class="e-desc">iOS 小组件 · 安卓添加主屏幕</div>
      </div>
      <div class="e-arrow">›</div>
    </a>
  </div>

  <div class="updated">数据更新至 <b id="date">…</b></div>
</div>
<script>
  fetch("data.json", {cache:"no-store"})
    .then(r => r.json())
    .then(d => {
      const last = d[d.length - 1];
      document.getElementById("date").textContent = last.date + " · " + (last.items || []).length + " 条";
    })
    .catch(() => {});
</script>
</body>
</html>
